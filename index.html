<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6F8F" />
    <meta name="description" content="«Приём» — учебный симулятор логопедического обследования детей 4–7 лет." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Приём" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Приём — симулятор логопедического обследования</title>
    <style>
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7f8;
        color: #5f6d78;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">Загрузка «Приёма»…</div>
    </div>
    <noscript>
      <div class="boot-screen">Для работы приложения нужен JavaScript. Включите его и обновите страницу.</div>
    </noscript>
    <script>
      window.setTimeout(function () {
        var screen = document.querySelector('.boot-screen');
        if (screen) {
          screen.textContent = 'Не удалось загрузить приложение. Проверьте соединение и обновите страницу.';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
